# -----------------------------------------------------------------------
#  Service DB credentials
# -----------------------------------------------------------------------
.service-db-secret-manager-script: &service-db-secret-manager-script
  - export DB_HOST=$(aws secretsmanager get-secret-value --secret-id SECRET-YOUR-ORG-RDS-${ENV}-MONITORING-DB --region us-east-1 --query SecretString --output text | jq '.host' | sed 's/"//g')
  - export DB_USER=$(aws secretsmanager get-secret-value --secret-id SECRET-YOUR-ORG-RDS-${ENV}-MONITORING-DB --region us-east-1 --query SecretString --output text | jq '.username' | sed 's/"//g')
  - export DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id SECRET-YOUR-ORG-RDS-${ENV}-MONITORING-DB --region us-east-1 --query SecretString --output text | jq '.password' | sed 's/"//g')

.service-db-secret-manager-replace-script: &service-db-secret-manager-replace-script
  - sed -i "s,ENV_DB_HOST,${DB_HOST},g" backend/manifests/${CI_ENVIRONMENT_NAME}/secret.yaml
  - sed -i "s,ENV_DB_USER,${DB_USER},g" backend/manifests/${CI_ENVIRONMENT_NAME}/secret.yaml
  - sed -i "s,ENV_DB_PASSWORD,${DB_PASSWORD},g" backend/manifests/${CI_ENVIRONMENT_NAME}/secret.yaml

.service-db-secret-manager-replace-script-ENV_NUM: &service-db-secret-manager-replace-script-ENV_NUM
  - sed -i "s,ENV_DB_HOST,${DB_HOST},g" backend/manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml
  - sed -i "s,ENV_DB_USER,${DB_USER},g" backend/manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml
  - sed -i "s,ENV_DB_PASSWORD,${DB_PASSWORD},g" backend/manifests/${CI_ENVIRONMENT_NAME}_env/secret.yaml

