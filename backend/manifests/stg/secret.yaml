apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.common.appDetail.name }}
  namespace: {{ .Values.common.appDetail.nameSpace }}
type: Opaque
data:
  JAVA_OPTS: {{ "ENV_JAVA_OPTS" | b64enc }}
  DB_HOST: {{ "ENV_DB_HOST" | b64enc }}
  DB_USER: {{ "ENV_DB_USER" | b64enc }}
  DB_PASSWORD: {{ "ENV_DB_PASSWORD" | b64enc }}
  DB1_HOST: {{ "ENV_DB1_HOST" | b64enc }}
  DB1_USER: {{ "ENV_DB1_USER" | b64enc }}
  DB1_PASSWORD: {{ "ENV_DB1_PASSWORD" | b64enc }}
  DB1_NAME: {{ "ENV_DB1_NAME" | b64enc }}
  DB2_HOST: {{ "ENV_DB2_HOST" | b64enc }}
  DB2_USER: {{ "ENV_DB2_USER" | b64enc }}
  DB2_PASSWORD: {{ "ENV_DB2_PASSWORD" | b64enc }}
  DB2_NAME: {{ "ENV_DB2_NAME" | b64enc }}
  DB3_HOST: {{ "ENV_DB3_HOST" | b64enc }}
  DB3_USER: {{ "ENV_DB3_USER" | b64enc }}
  DB3_PASSWORD: {{ "ENV_DB3_PASSWORD" | b64enc }}
  DB3_NAME: {{ "ENV_DB3_NAME" | b64enc }}
  DB4_HOST: {{ "ENV_DB4_HOST" | b64enc }}
  DB4_USER: {{ "ENV_DB4_USER" | b64enc }}
  DB4_PASSWORD: {{ "ENV_DB4_PASSWORD" | b64enc }}
  DB4_NAME: {{ "ENV_DB4_NAME" | b64enc }}
  # Authentication. AUTH_BOOTSTRAP_ADMINS is the standing guarantee that at least one
  # account keeps ADMIN — it is read on every request and cannot be edited away from the
  # admin UI, so populate it in every environment.
  # AUTH_ENABLED: {{ "true" | b64enc }}
  # AUTH_ROLE_SOURCE: {{ "both" | b64enc }}
  # AUTH_DEFAULT_ROLE: {{ "VIEWER" | b64enc }}
  # AUTH_BOOTSTRAP_ADMINS: {{ "ENV_AUTH_BOOTSTRAP_ADMINS" | b64enc }}
  # COGNITO_ISSUER_URI: {{ "ENV_COGNITO_ISSUER_URI" | b64enc }}
  # COGNITO_USER_POOL_ID: {{ "ENV_COGNITO_USER_POOL_ID" | b64enc }}
  # COGNITO_CLIENT_ID: {{ "ENV_COGNITO_CLIENT_ID" | b64enc }}
  # COGNITO_CLIENT_SECRET: {{ "ENV_COGNITO_CLIENT_SECRET" | b64enc }}
  # COGNITO_DOMAIN: {{ "ENV_COGNITO_DOMAIN" | b64enc }}
  # COGNITO_REDIRECT_URI: {{ "ENV_COGNITO_REDIRECT_URI" | b64enc }}
  # COGNITO_POST_LOGIN_REDIRECT_URI: {{ "ENV_COGNITO_POST_LOGIN_REDIRECT_URI" | b64enc }}
  # Alert publishing
  # MONITORING_EMAIL_ENABLED: {{ "true" | b64enc }}
  # COMMUNICATION_EVENTS_QUEUE_URL: {{ "ENV_COMMUNICATION_EVENTS_QUEUE_URL" | b64enc }}
  # AWS_REGION: {{ "ENV_AWS_REGION" | b64enc }}
  # AWS_ACCESS_KEY: {{ "ENV_AWS_ACCESS_KEY" | b64enc }}
  # AWS_SECRET_KEY: {{ "ENV_AWS_SECRET_KEY" | b64enc }}
  # SLACK_WEBHOOK_URL: {{ "ENV_SLACK_WEBHOOK_URL" | b64enc }}
  NEW_RELIC_APP_NAME: {{ "[ENV_SPRING_PROFILES_ACTIVE] datawatch" | b64enc }}
  NEW_RELIC_AGENT_ENABLED: {{ "true" | b64enc }}
  NEW_RELIC_LICENSE_KEY: {{ "ENV_NEW_RELIC_LICENSE_KEY" | b64enc }}
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: {{ "ENV_NEW_RELIC_DISTRIBUTED_TRACING_ENABLED" | b64enc }}
  NEW_RELIC_TRANSACTION_EVENTS_MAX_SAMPLES_STORED: {{ "ENV_NEW_RELIC_TRANSACTION_EVENTS_MAX_SAMPLES_STORED" | b64enc }}
